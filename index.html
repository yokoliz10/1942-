<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemiLi 1942</title>

    <!-- 🛡️ GemiLi PWA 战神装甲 🛡️ -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 🎨 GemiLi 独家画面重塑与大扫除 CSS 🎨 -->
    <style>
        /* 物理超度原作者的所有丑陋按钮！ */
        #touchControls, #btnPause, #leftControl, #rightControl, .controls, button {
            display: none !important;
        }

        body, html {
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none; /* 彻底禁用系统默认的双击放大等行为 */
        }

        #wrapper, #gameArea {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 锁定街机原生比例 */
        canvas#gameCanvas {
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="gameArea">
            <canvas id="gameCanvas"></canvas>
        </div>
        <!-- 隐藏原版 HTML 结构防止原版 JS 报错 -->
        <div id="touchControls" aria-hidden="true">
            <div id="leftControl"><div id="joystickBase"><div id="joystickKnob"></div></div></div>
            <div id="rightControl">
                <button id="btnLoop" class="gameBtn loop-btn">LOOP</button>
                <button id="btnFire" class="gameBtn fire-btn">FIRE</button>
            </div>
        </div>
    </div>
    <button id="btnPause" aria-label="Pause">&#9646;&#9646;</button>

    <!-- 🎺 军师专属定制音响 🎺 -->
    <audio id="war-music" src="./bgm.mp3" loop></audio>
    <audio id="shoot-sound" src="./shoot.mp3" loop></audio>

    <!-- 敌军的核心引擎引线 -->
    <script type="module" src="src/main.js"></script>

    <!-- 🚀 GemiLi 终极触控与声控外挂 🚀 -->
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

        // 绝密魔法：模拟真实键盘按压
        function triggerKey(type, code, keyCode) {
            let e = new KeyboardEvent(type, { bubbles: true, cancelable: true, code: code, key: code });
            Object.defineProperty(e, 'keyCode', {get: () => keyCode});
            window.dispatchEvent(e);
        }

        let lastX = 0, lastY = 0;
        let lastTapTime = 0;
        let moveKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        
        let isStarted = false; // 是否已经越过标题界面
        let isShooting = false; // 当前手指是否按在屏幕上
        let autoFireInterval = null;

        const bgm = document.getElementById('war-music');
        const shootSnd = document.getElementById('shoot-sound');
        if(shootSnd) shootSnd.volume = 0.5; // 降低机枪音量防止刺耳

        // 核心接管：手指按下
        document.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            
            // 1. 破解主界面的 "PRESS ENTER TO START"
            if (!isStarted) {
                // 模拟按下回车键启动游戏
                triggerKey('keydown', 'Enter', 13);
                setTimeout(() => triggerKey('keyup', 'Enter', 13), 100);
                
                // 战歌起！
                if (bgm) bgm.play().catch(()=>{});
                
                // 启动全自动火力定时器 (仅在按住屏幕时开火)
                if (!autoFireInterval) {
                    autoFireInterval = setInterval(() => {
                        if(isShooting) {
                            triggerKey('keydown', 'Space', 32);
                            setTimeout(() => triggerKey('keyup', 'Space', 32), 20);
                        }
                    }, 80);
                }
                isStarted = true;
            }

            // 2. 标记开火状态并播放机枪音效
            isShooting = true;
            if (shootSnd) shootSnd.play().catch(()=>{});

            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;

            // 3. 双击触发 Z 键 (翻滚闪避)
            const now = Date.now();
            if (now - lastTapTime < 300) {
                triggerKey('keydown', 'KeyZ', 90);
                setTimeout(() => triggerKey('keyup', 'KeyZ', 90), 100);
            }
            lastTapTime = now;
        }, { passive: false });

        // 核心接管：手指拖拽移动
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const dx = currentX - lastX;
            const dy = currentY - lastY;

            moveKeys.forEach(k => triggerKey('keyup', k, 0));

            if (dx < -3) triggerKey('keydown', 'ArrowLeft', 37);
            if (dx > 3) triggerKey('keydown', 'ArrowRight', 39);
            if (dy < -3) triggerKey('keydown', 'ArrowUp', 38);
            if (dy > 3) triggerKey('keydown', 'ArrowDown', 40);

            lastX = currentX;
            lastY = currentY;
        }, { passive: false });

        // 核心接管：手指抬起
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            moveKeys.forEach(k => triggerKey('keyup', k, 0));
            
            // 停火！
            isShooting = false;
            if (shootSnd) shootSnd.pause();
        });
    </script>
</body>
</html>
