<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemiLi 1942</title>

    <!-- 🛡️ 战神装甲 (加了版本号，强行刷新缓存) 🛡️ -->
    <link rel="manifest" href="./manifest.json?v=999">
    <link rel="apple-touch-icon" href="./icon.png?v=999">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* 物理超度丑陋的旧按键！ */
        #touchControls, #btnPause, #leftControl, #rightControl, .controls, button {
            display: none !important; opacity: 0 !important; pointer-events: none !important;
        }

        body, html {
            background-color: #000000 !important;
            display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh; margin: 0; padding: 0;
            overflow: hidden; touch-action: none;
        }

        #wrapper, #gameArea { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        canvas#gameCanvas {
            max-width: 100vw !important; max-height: 100vh !important;
            object-fit: contain !important;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="gameArea"><canvas id="gameCanvas"></canvas></div>
        <!-- 保留空壳防报错 -->
        <div id="touchControls" aria-hidden="true"><div id="leftControl"></div><div id="rightControl"></div></div>
    </div>

    <!-- 🎺 强行挂载主公的专属音乐 (加了版本号强制拉取新文件) 🎺 -->
    <audio id="war-music" src="./bgm.mp3?v=new" loop></audio>
    <audio id="shoot-sound" src="./shoot.mp3?v=new" loop></audio>

    <script type="module" src="src/main.js?v=new"></script>

    <!-- 🚀 军师的“外挂”核心 🚀 -->
    <script>
        // ⚔️ 幽灵退散咒：强行注销所有旧的缓存后勤兵！
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }

        // 绝密魔法：发送物理键盘指令
        function triggerKey(type, code) {
            window.dispatchEvent(new KeyboardEvent(type, { bubbles: true, cancelable: true, code: code, key: code }));
        }

        // 按键状态机，防止重复发送
        let activeKeys = new Set();
        function updateKey(code, isDown) {
            if (isDown && !activeKeys.has(code)) {
                triggerKey('keydown', code); activeKeys.add(code);
            } else if (!isDown && activeKeys.has(code)) {
                triggerKey('keyup', code); activeKeys.delete(code);
            }
        }

        let startX = 0, startY = 0;
        let lastTapTime = 0;
        let isStarted = false;
        let autoFireInterval = null;

        const bgm = document.getElementById('war-music');
        const shootSnd = document.getElementById('shoot-sound');
        if(shootSnd) shootSnd.volume = 0.4;

        // 手指按下屏幕
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;

            // 越过主界面，开启全自动重机枪
            if (!isStarted) {
                triggerKey('keydown', 'Enter'); setTimeout(() => triggerKey('keyup', 'Enter'), 100);
                if (bgm) bgm.play().catch(()=>{});
                autoFireInterval = setInterval(() => {
                    triggerKey('keydown', 'Space'); setTimeout(() => triggerKey('keyup', 'Space'), 20);
                }, 80);
                isStarted = true;
            }

            if (shootSnd) shootSnd.play().catch(()=>{}); // 开火音效起

            // 双击翻滚 (Z键)
            const now = Date.now();
            if (now - lastTapTime < 300) {
                triggerKey('keydown', 'KeyZ'); setTimeout(() => triggerKey('keyup', 'KeyZ'), 100);
            }
            lastTapTime = now;
        }, { passive: false, capture: true });

        // 手指滑动 (隐形摇杆，带20像素防手抖死区)
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let dx = e.touches[0].clientX - startX;
            let dy = e.touches[0].clientY - startY;

            updateKey('ArrowLeft', dx < -20);
            updateKey('ArrowRight', dx > 20);
            updateKey('ArrowUp', dy < -20);
            updateKey('ArrowDown', dy > 20);
        }, { passive: false, capture: true });

        // 手指离开
        window.addEventListener('touchend', (e) => {
            e.preventDefault();
            ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].forEach(k => updateKey(k, false)); // 停止移动
            if (shootSnd) shootSnd.pause(); // 停火音效
        }, { passive: false, capture: true });
    </script>
</body>
</html>
