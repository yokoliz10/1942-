<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemiLi 1942</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <style>
        /* 物理超度一切旧按键！ */
        #touchControls, #btnPause, #leftControl, #rightControl, .controls, button { display: none !important; }
        body, html {
            background-color: #000000 !important; display: flex; justify-content: center; align-items: center;
            width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none;
        }
        #wrapper, #gameArea { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas#gameCanvas {
            max-width: 100vw !important; max-height: 100vh !important; object-fit: contain !important;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="gameArea"><canvas id="gameCanvas"></canvas></div>
    </div>

    <!-- 🎶 主公专属音响 🎶 -->
    <audio id="war-music" src="./bgm.mp3" loop></audio>

    <script type="module" src="src/main.js"></script>

    <script>
        // 注销缓存幽灵！
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => { for(let r of regs) r.unregister(); });
        }

        // 强力按键模拟器 (带 keyCode 防止老引擎不识别)
        function triggerKey(type, code, keyCode) {
            let e = new KeyboardEvent(type, { bubbles: true, cancelable: true, code: code, key: code });
            Object.defineProperty(e, 'keyCode', {get: () => keyCode});
            window.dispatchEvent(e);
        }

        let activeKeys = new Set();
        function updateKey(code, keyCode, isDown) {
            if (isDown && !activeKeys.has(code)) { triggerKey('keydown', code, keyCode); activeKeys.add(code); }
            else if (!isDown && activeKeys.has(code)) { triggerKey('keyup', code, keyCode); activeKeys.delete(code); }
        }

        let startX = 0, startY = 0;
        let lastTapTime = 0;
        let isStarted = false;
        const bgm = document.getElementById('war-music');

        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;

            if (!isStarted) {
                // 模拟敲击回车，越过主菜单
                triggerKey('keydown', 'Enter', 13); setTimeout(() => triggerKey('keyup', 'Enter', 13), 100);
                if (bgm) bgm.play().catch(()=>{});
                // 全自动无限开火
                setInterval(() => {
                    triggerKey('keydown', 'Space', 32); setTimeout(() => triggerKey('keyup', 'Space', 32), 20);
                }, 80);
                isStarted = true;
            }

            // 双击屏幕翻滚 (Z键)
            const now = Date.now();
            if (now - lastTapTime < 300) {
                triggerKey('keydown', 'KeyZ', 90); setTimeout(() => triggerKey('keyup', 'KeyZ', 90), 100);
            }
            lastTapTime = now;
        }, { passive: false });

        // 丝滑相对滑动
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let dx = currentX - startX;
            let dy = currentY - startY;

            updateKey('ArrowLeft', 37, dx < -5);
            updateKey('ArrowRight', 39, dx > 5);
            updateKey('ArrowUp', 38, dy < -5);
            updateKey('ArrowDown', 40, dy > 5);

            // 更新摇杆原点，实现无限拖拽
            startX = currentX;
            startY = currentY;
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            e.preventDefault();
            updateKey('ArrowLeft', 37, false); updateKey('ArrowRight', 39, false);
            updateKey('ArrowUp', 38, false); updateKey('ArrowDown', 40, false);
        }, { passive: false });
    </script>
</body>
</html>
