<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemiLi 1942</title>

    <!-- 🛡️ GemiLi PWA 战神装甲 🛡️ -->
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 🎨 GemiLi 独家画面重塑与大扫除 CSS 🎨 -->
    <style>
        /* 1. 物理超度原作者的丑陋按钮！全部隐藏，一个不留！ */
        #touchControls, #btnPause, #leftControl, #rightControl {
            display: none !important;
        }

        /* 2. 打造沉浸式纯黑背景，完美居中 */
        body, html {
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 防止出现溢出滚动条 */
            touch-action: none; /* 彻底禁用系统默认的双击放大、滑动返回等行为 */
        }

        #wrapper, #gameArea {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. 核心魔法：锁定街机原生比例，拒绝拉伸变形！ */
        canvas#gameCanvas {
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important; /* 关键：保持自身比例缩放，绝对不拉伸 */
            
            /* 顶级细节：为手机顶部的刘海/灵动岛，以及底部的小黑条留出安全距离 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <!-- 游戏主战场 -->
        <div id="gameArea">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- 原作者的虚拟按键 (已被CSS阵法隐藏，但保留代码骨架防止原版JS报错) -->
        <div id="touchControls" aria-hidden="true">
            <div id="leftControl">
                <div id="joystickBase"><div id="joystickKnob"></div></div>
            </div>
            <div id="rightControl">
                <button id="btnLoop" class="gameBtn loop-btn">LOOP</button>
                <button id="btnFire" class="gameBtn fire-btn">FIRE</button>
            </div>
        </div>
    </div>

    <!-- 原版暂停按钮 (隐藏保留) -->
    <button id="btnPause" aria-label="Pause">&#9646;&#9646;</button>

    <!-- 敌军的核心引擎引线 -->
    <script type="module" src="src/main.js"></script>

    <!-- 🚀 GemiLi 方案A：全屏拖拽 + 自动开火 + 双击翻滚 🚀 -->
    <script>
        // 唤醒 PWA
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

        // 绝密魔法：模拟真实键盘按压
        function triggerKey(type, code, keyCode) {
            let e = new KeyboardEvent(type, { bubbles: true, cancelable: true, code: code, key: code });
            Object.defineProperty(e, 'keyCode', {get: () => keyCode});
            window.dispatchEvent(e);
        }

        let lastX = 0, lastY = 0;
        let lastTapTime = 0;
        let moveKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

        // 1. 全自动无限开火 (每 80 毫秒按一次空格)
        setInterval(() => {
            triggerKey('keydown', 'Space', 32);
            setTimeout(() => triggerKey('keyup', 'Space', 32), 20);
        }, 80);

        // 2. 接管屏幕触摸
        document.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 强行屏蔽原作者可能留下的触控逻辑
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;

            // 3. 双击触发 Z 键 (翻滚闪避)
            const now = Date.now();
            if (now - lastTapTime < 300) {
                triggerKey('keydown', 'KeyZ', 90);
                setTimeout(() => triggerKey('keyup', 'KeyZ', 90), 100);
            }
            lastTapTime = now;
        }, { passive: false });

        // 4. 相对拖拽，转换成方向键
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const dx = currentX - lastX;
            const dy = currentY - lastY;

            // 先松开所有方向键
            moveKeys.forEach(k => triggerKey('keyup', k, 0));

            // 根据滑动差值，按下对应的方向键 (灵敏度可调，目前是 3 像素差值)
            if (dx < -3) triggerKey('keydown', 'ArrowLeft', 37);
            if (dx > 3) triggerKey('keydown', 'ArrowRight', 39);
            if (dy < -3) triggerKey('keydown', 'ArrowUp', 38);
            if (dy > 3) triggerKey('keydown', 'ArrowDown', 40);

            lastX = currentX;
            lastY = currentY;
        }, { passive: false });

        // 5. 手指离开，松开摇杆
        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            moveKeys.forEach(k => triggerKey('keyup', k, 0));
        });
    </script>
</body>
</html>
